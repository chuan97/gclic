# Builds gclic for Windows and publishes it as a GitHub Release, when a
# version tag is pushed:
#
#     git tag v0.2.0
#     git push origin v0.2.0
#
# The tag must match the version in Cargo.toml. A suffix after a dash, as in
# v0.2.0-rc.1, makes a pre-release, for trying a build before releasing it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          in_cargo=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          version="${GITHUB_REF_NAME#v}"
          if [ "${version%%-*}" != "$in_cargo" ]; then
            echo "Cargo.toml says $in_cargo, but the tag is $GITHUB_REF_NAME"
            exit 1
          fi
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path target/release/gclic.exe, README.md -DestinationPath "gclic-$env:GITHUB_REF_NAME-windows-x86_64.zip"
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" "gclic-$GITHUB_REF_NAME-windows-x86_64.zip" \
            --title "gclic $GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease
