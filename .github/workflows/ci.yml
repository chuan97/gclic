# Builds and tests gclic on macOS, Linux and Windows for pull requests, when one is
# opened, reopened, or gets new commits, and for commits pushed to main without
# one. On macOS it checks the Neovim plugin too, end to end, in headless Neovim
# with the gclic just built.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same pull request cancels a run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Neovim plugin
        if: runner.os == 'macOS'
        run: |
          brew install neovim
          cargo build --locked
          nvim --headless --clean -l tests/nvim/sidebar.lua target/debug/gclic
