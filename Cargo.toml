[package]
name = "gclic"
version = "0.2.1"
edition = "2024"

[dependencies]
anyhow = "1"
arboard = { version = "3.7.0", default-features = false }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }

# Dependencies are optimised even in debug builds, as syntax highlighting is
# painfully slow without it. gclic's own code still builds quickly for debugging.
[profile.dev.package."*"]
opt-level = 3
